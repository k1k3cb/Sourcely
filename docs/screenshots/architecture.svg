<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Sourcely architecture diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b" />
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#0a0a0a" />
  <text x="600" y="60" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="700" fill="#fafafa" text-anchor="middle">Sourcely — RAG pipeline</text>
  <g font-family="ui-sans-serif, system-ui" font-size="12" fill="#e4e4e7">
    <!-- User -->
    <g transform="translate(80,310)">
      <circle cx="40" cy="40" r="32" fill="#27272a" stroke="#52525b" />
      <text x="40" y="48" text-anchor="middle" font-size="20">👤</text>
      <text x="40" y="110" font-weight="600" fill="#fafafa" text-anchor="middle">user</text>
      <text x="40" y="130" fill="#a1a1aa" text-anchor="middle">browser</text>
    </g>
    <!-- Arrow -->
    <line x1="160" y1="350" x2="280" y2="350" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="220" y="340" fill="#a1a1aa" text-anchor="middle" font-size="11">HTTPS · cookie</text>

    <!-- Next.js -->
    <g transform="translate(290,290)">
      <rect width="160" height="120" rx="10" fill="#18181b" stroke="#3f3f46" />
      <text x="80" y="34" font-weight="700" fill="#fafafa" text-anchor="middle">Next.js 16</text>
      <text x="80" y="58" fill="#a1a1aa" text-anchor="middle">App Router · SSR</text>
      <text x="80" y="78" fill="#a1a1aa" text-anchor="middle">SSE streaming</text>
      <text x="80" y="98" fill="#a1a1aa" text-anchor="middle">Tailwind · RSC</text>
    </g>

    <line x1="450" y1="350" x2="540" y2="350" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="495" y="340" fill="#a1a1aa" text-anchor="middle" font-size="11">REST + SSE</text>

    <!-- FastAPI -->
    <g transform="translate(550,260)">
      <rect width="180" height="180" rx="10" fill="#18181b" stroke="#3f3f46" />
      <text x="90" y="30" font-weight="700" fill="#fafafa" text-anchor="middle">FastAPI</text>
      <line x1="20" y1="46" x2="160" y2="46" stroke="#27272a" />
      <text x="20" y="68" fill="#a1a1aa">/auth      JWT cookie</text>
      <text x="20" y="88" fill="#a1a1aa">/documents upload/list</text>
      <text x="20" y="108" fill="#a1a1aa">/query     k-NN + LLM</text>
      <text x="20" y="128" fill="#a1a1aa">/query/stream SSE</text>
      <text x="20" y="148" fill="#a1a1aa">/chunks/{id}</text>
    </g>

    <line x1="730" y1="280" x2="800" y2="180" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="765" y="220" fill="#a1a1aa" font-size="11">embed &amp; rank</text>
    <line x1="730" y1="350" x2="800" y2="350" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="765" y="340" fill="#a1a1aa" text-anchor="middle" font-size="11">read/write</text>
    <line x1="730" y1="420" x2="800" y2="520" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="765" y="490" fill="#a1a1aa" font-size="11">transcribe &amp; upload</text>

    <!-- Gemini -->
    <g transform="translate(810,130)">
      <rect width="180" height="100" rx="10" fill="#1e1b4b" stroke="#6366f1" />
      <text x="90" y="28" font-weight="700" fill="#e0e7ff" text-anchor="middle">Gemini</text>
      <text x="90" y="50" fill="#c7d2fe" text-anchor="middle">text-embedding-001</text>
      <text x="90" y="70" fill="#a5b4fc" text-anchor="middle" font-size="11">768d · coseno</text>
    </g>

    <!-- Supabase -->
    <g transform="translate(810,300)">
      <rect width="180" height="100" rx="10" fill="#0c4a6e" stroke="#38bdf8" />
      <text x="90" y="28" font-weight="700" fill="#e0f2fe" text-anchor="middle">Supabase</text>
      <text x="90" y="50" fill="#bae6fd" text-anchor="middle">Postgres · pgvector</text>
      <text x="90" y="70" fill="#7dd3fc" text-anchor="middle" font-size="11">HNSW · per-user filter</text>
    </g>

    <!-- Groq -->
    <g transform="translate(810,470)">
      <rect width="180" height="100" rx="10" fill="#14532d" stroke="#22c55e" />
      <text x="90" y="28" font-weight="700" fill="#dcfce7" text-anchor="middle">Groq</text>
      <text x="90" y="50" fill="#bbf7d0" text-anchor="middle">llama-3.3-70b</text>
      <text x="90" y="70" fill="#86efac" text-anchor="middle" font-size="11">answer · [n] citations</text>
    </g>
  </g>
</svg>
